<!DOCTYPE html>
<!-- lang 由 app.js 按探测到的 locale 覆写（issue #3） -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibepaws</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 宠物舞台（拖拽区）；data-i18n-title 由 app.js 的 applyStaticI18n 填充 -->
  <div id="stage" data-i18n-title="ui.drag">
    <canvas id="pet" width="208" height="208" role="button" tabindex="0" data-i18n-aria="ui.pet.aria"></canvas>
    <!-- EXP 条 -->
    <div id="expbar">
      <div id="expfill"></div>
      <span id="exptext">Lv.1</span>
    </div>
    <!-- 名字徽章 + 今天的 Session Health pip 条（R12；只在可见性为 everywhere 时出现，见 app.js 的 renderNameplate） -->
    <div id="nameplate">
      <span id="pet-name"></span>
      <span id="pips" class="pips" role="img" hidden></span>
    </div>
    <!-- 连接状态点 -->
    <div id="conn" class="conn-unknown" data-i18n-title="ui.conn.title"></div>
    <!-- 静音徽章（issue #7：静音必须是看得见、点得掉的状态） -->
    <button id="mute-badge" type="button" hidden></button>
  </div>

  <!-- 气泡层（Core 的通知）。不做 live region：顶 / 单行换位会让整层重读一遍；
       出现时的播报走下面两个看不见的区域（R28：可操作的 assertive，辅导类 polite） -->
  <div id="bubbles"></div>
  <div id="bubble-alert" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <div id="bubble-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <!-- 提示层（本机操作确认）：和通知分开，否则一串通知会把「已复制」顶掉 -->
  <div id="toasts" aria-live="polite"></div>

  <!-- 浮层（点击宠物弹出） -->
  <div id="panel" role="dialog" aria-modal="false" hidden>
    <div id="panel-head">
      <span id="panel-title">Vibepaws</span>
      <button id="panel-close" type="button" data-i18n-title="ui.panel.close" data-i18n-aria="ui.panel.close">×</button>
    </div>
    <div id="panel-body">
      <div id="sessions"></div>
      <div id="panel-actions">
        <button id="act-mute" type="button" data-i18n-title="ui.action.mute30" aria-pressed="false">🔕 30m</button>
        <button id="act-mute2h" type="button" data-i18n-title="ui.action.mute2h" aria-pressed="false">😴 2h</button>
        <button id="act-exp" type="button" data-i18n-title="ui.action.exp" aria-expanded="false">📈 EXP</button>
        <!-- Den（U13）：今天收工的段、日志、成长。浮层管「此刻先处理哪一个」，Den 管「今天怎么样了」 -->
        <button id="act-den" type="button" data-i18n-title="ui.action.den" data-i18n-aria="ui.action.den">🏠</button>
        <!-- 设置窗口（壳里是一扇独立窗口，浏览器里是新标签页） -->
        <button id="act-settings" type="button" data-i18n-title="ui.action.settings" data-i18n-aria="ui.action.settings">⚙</button>
      </div>
      <div id="explog" hidden></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
