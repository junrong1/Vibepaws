<!DOCTYPE html>
<!-- lang 由 app.js 按探测到的 locale 覆写（issue #3） -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibepaws</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 宠物舞台（拖拽区）；data-i18n-title 由 app.js 的 applyStaticI18n 填充 -->
  <div id="stage" data-i18n-title="ui.drag">
    <canvas id="pet" width="160" height="160"></canvas>
    <!-- EXP 条 -->
    <div id="expbar">
      <div id="expfill"></div>
      <span id="exptext">Lv.1</span>
    </div>
    <!-- 名字徽章 -->
    <div id="nameplate"></div>
    <!-- 连接状态点 -->
    <div id="conn" class="conn-unknown" data-i18n-title="ui.conn.title"></div>
  </div>

  <!-- 气泡层 -->
  <div id="bubbles"></div>

  <!-- 浮层（点击宠物弹出） -->
  <div id="panel" hidden>
    <div id="panel-head">
      <span id="panel-title">Vibepaws</span>
      <button id="panel-close" data-i18n-title="ui.panel.close">×</button>
    </div>
    <div id="panel-body">
      <div id="sessions"></div>
      <div id="panel-actions">
        <button id="act-mute" data-i18n-title="ui.action.mute30">🔕 30m</button>
        <button id="act-mute2h" data-i18n-title="ui.action.mute2h">😴 2h</button>
        <button id="act-exp" data-i18n-title="ui.action.exp">📈 EXP</button>
      </div>
      <div id="explog" hidden></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
